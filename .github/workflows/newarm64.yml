name: Build ARM64 Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Prepare Sherpa-ONNX
        run: |
          chmod +x gradlew tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Build ARM64 Release
        run: |
          ./gradlew assembleRelease \
            -PtargetAbi=arm64-v8a \
            --no-configuration-cache \
            --build-cache

      - name: Sign ARM64 APK
        env:
          KEYSTORE_B64: ${{ secrets.DICTATE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DICTATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DICTATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DICTATE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -1)

          "$ZIPALIGN" -f -p 4 \
            "$APK" \
            aligned.apk

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "DictateKeyboard-arm64-v8a.apk" \
            aligned.apk

          "$APKSIGNER" verify "DictateKeyboard-arm64-v8a.apk"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-arm64-v8a
          path: DictateKeyboard-arm64-v8a.apk
          if-no-files-found: error
