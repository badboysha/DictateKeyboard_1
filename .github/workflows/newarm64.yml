name: Build ARM64 Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Prepare Sherpa-ONNX
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Build ARM64 Release APK
        run: |
          ./gradlew assembleRelease \
            -PtargetAbi=arm64-v8a \
            --configuration-cache \
            --parallel \
            --stacktrace

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DICTATE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: DICTATE_KEYSTORE_B64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > release.keystore

          if [ ! -s release.keystore ]; then
            echo "ERROR: Failed to restore release.keystore."
            exit 1
          fi

      - name: Sign and optimize ARM64 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DICTATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DICTATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DICTATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: DICTATE_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: DICTATE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: DICTATE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -name zipalign | sort -V | tail -1)

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            aligned.apk

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "DictateKeyboard-arm64-v8a.apk" \
            aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            "DictateKeyboard-arm64-v8a.apk"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-arm64-v8a
          path: DictateKeyboard-arm64-v8a.apk
          if-no-files-found: error
