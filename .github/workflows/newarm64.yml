name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Prepare Sherpa-ONNX
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Build ARM64 APK
        run: ./gradlew assembleRelease -PtargetAbi=arm64-v8a

      - name: Sign APK
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias dictate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DictateKeyboard, OU=Android, O=DictateKeyboard, L=Unknown, ST=Unknown, C=IN"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -name zipalign | sort -V | tail -1)

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" | head -1)

          "$ZIPALIGN" -f -p 4 "$APK" aligned.apk

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias dictate \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out DictateKeyboard-arm64-v8a.apk \
            aligned.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-arm64-v8a
          path: DictateKeyboard-arm64-v8a.apk
          if-no-files-found: error
