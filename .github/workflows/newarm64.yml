name: ARM64 Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          chmod +x tools/bergamot/build-android.sh

      - name: Build Bergamot
        run: ./tools/bergamot/build-android.sh

      - name: Fetch Sherpa-ONNX
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias dictate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DictateKeyboard, OU=Android, O=DictateKeyboard, L=Unknown, ST=Unknown, C=IN"

      - name: Sign APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" \
            | head -1)

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias dictate \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -1)

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" \
            | head -1)

          "$APKSIGNER" verify "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-ARM64-Signed-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: Build
