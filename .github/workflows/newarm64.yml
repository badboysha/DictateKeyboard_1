name: Build ARM64 + ARMv7 Release APKs

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Prepare Sherpa-ONNX
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Build ${{ matrix.abi }} Release APK
        run: |
          ./gradlew assembleRelease \
            -PtargetAbi=${{ matrix.abi }} \
            --no-configuration-cache \
            --stacktrace

      - name: Sign and optimize ${{ matrix.abi }} APK
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias dictate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DictateKeyboard, OU=Android, O=DictateKeyboard, L=Unknown, ST=Unknown, C=IN"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -1)

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -name zipalign | sort -V | tail -1)

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            aligned.apk

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias dictate \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "DictateKeyboard-${{ matrix.abi }}.apk" \
            aligned.apk

      - name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-${{ matrix.abi }}
          path: DictateKeyboard-${{ matrix.abi }}.apk
          if-no-files-found: error
