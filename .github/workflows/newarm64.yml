name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing keystore
        run: |
          set -e

          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)
          KEY_PASSWORD="$KEYSTORE_PASSWORD"
          KEY_ALIAS="dictate"

          echo "::add-mask::$KEYSTORE_PASSWORD"

          keytool -genkeypair \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=DictateKeyboard, OU=Android, O=DictateKeyboard, L=Unknown, ST=Unknown, C=IN"

          echo "$KEYSTORE_PASSWORD" > keystore-password.txt
          echo "$KEY_ALIAS" > key-alias.txt
          echo "$KEY_PASSWORD" > key-password.txt

          base64 -w 0 release.keystore > keystore-base64.txt

          echo "Keystore generated successfully."
          echo "Alias: $KEY_ALIAS"
          echo "Keystore and signing information prepared as artifacts."

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore release.keystore \
            -storepass "$(cat keystore-password.txt)" \
            -alias "$(cat key-alias.txt)"

      - name: Upload signing files
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-Signing-Keystore
          path: |
            release.keystore
            keystore-base64.txt
            keystore-password.txt
            key-alias.txt
            key-password.txt
            retention-days: 1
          if-no-files-found: error
