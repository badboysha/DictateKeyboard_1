name: Build Optimized ARM64 Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6

        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh

      - name: Fetch Sherpa-ONNX libraries
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Build Optimized ARM64 Release
        run: ./gradlew assembleRelease

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias dictate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Dictate, OU=Android, O=Dictate, L=Unknown, ST=Unknown, C=IN"

      - name: Sign APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          for APK in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-key-alias dictate \
              --ks-pass pass:android \
              --key-pass pass:android \
              "$APK"
          done

      - name: Verify ARM64 only
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          echo "=== Native libraries in APK ==="
          unzip -l "$APK" | grep "lib/" || true

          echo "=== Checking unwanted ABIs ==="
          if unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "ERROR: Unwanted ABI found!"
            exit 1
          fi

          echo "ARM64-only check passed."

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-arm64-optimized-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
