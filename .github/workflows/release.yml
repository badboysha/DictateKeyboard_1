name: Build Optimized Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh

      - name: Fetch Sherpa-ONNX libraries
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Build Optimized Signed Release
        run: ./gradlew assembleRelease

      - name: Show APK size
        run: |
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Compress APK
        run: |
          mkdir -p final
          cp app/build/outputs/apk/release/*.apk final/
          cd final
          zip -9 ../DictateKeyboard-optimized-signed.zip *.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-optimized-signed
          path: DictateKeyboard-optimized-signed.zip
          if-no-files-found: error
